<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sudoku</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <header class="topbar">
      <h1>Sudoku</h1>
      <div class="controls">
        <label for="difficulty">Difficulty</label>
        <select id="difficulty">
          <option value="easy">Easy</option>
          <option value="medium" selected>Medium</option>
          <option value="hard">Hard</option>
          <option value="veryhard">Very Hard</option>
        </select>
        <button id="newGameBtn">New Game</button>
      </div>
    </header>

    <div class="statusbar">
      <div class="stat"><span class="label">Time</span><span id="timer">00:00</span></div>
      <div class="stat"><span class="label">Mistakes</span><span id="mistakes">0</span></div>
      <div class="stat"><span class="label">Difficulty</span><span id="currentDifficulty">Medium</span></div>
    </div>

    <div class="board-wrap">
      <div id="board" class="board"></div>
    </div>

    <div class="numpad" id="numpad"></div>

    <div class="actions">
      <button id="notesBtn" class="toggle">Notes: Off</button>
      <button id="eraseBtn">Erase</button>
      <button id="hintBtn">Hint</button>
      <button id="checkBtn">Check</button>
      <button id="solveBtn">Solve</button>
    </div>

    <div id="message" class="message" aria-live="polite"></div>
  </div>

  <div id="winOverlay" class="overlay hidden">
    <div class="overlay-card">
      <h2>Puzzle Solved!</h2>
      <p id="winSummary"></p>
      <button id="winCloseBtn">New Game</button>
    </div>
  </div>

  <script src="sudoku.js"></script>
  <script src="app.js"></script>
</body>
</html>
